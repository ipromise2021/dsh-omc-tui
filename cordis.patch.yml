# A terminal app layer over the shared dsh-base services. It deliberately does
# not mount the Web host or server runtime.

# Profile reload can keep the TUI's long-lived plugin fibers pending and block
# ConfigEditor writes such as /model. CLI mode does not need file watching.
- id: hmr
  disabled: true

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Agent-facing tools and prompt sections are supplied by the selected preset.
# Keeping the base copies disabled prevents a minimal preset from inheriting
# the full standard catalog through the host layer.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
# The Harness compaction engine owns threshold pressure compaction. Between
# steps it condenses the oldest surface span above `thresholdRatio` and keeps a
# verbatim recent tail, so a running turn continues with the thread intact.
# The TUI only projects its lifecycle events; it must not compact by itself.
- id: compaction-basic
  config:
    thresholdRatio: 0.8
# `command-compact` stays enabled so the TUI's /compact wrapper reaches the
# official implementation through ctx.commands.
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    # Cordis preset tools read the official Host inspection service.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    # Shipped rc.1 presets opt into the Host-owned subagent model-selection policy.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    # The TUI starts a dedicated Chrome instance only when these tools run.
    - id: mcp-chrome-devtools
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome_devtools
        transport: stdio
        # chrome-devtools-mcp writes its legal and roots notices directly to
        # stderr. The Harness MCP client waits for the initial handshake before
        # its plugin fiber settles; cap that wait so a missing Chrome endpoint
        # cannot indefinitely block ConfigEditor writes such as /model.
        command: node
        args:
          - -e
          - >-
            const { spawn } = require('node:child_process');
            const npx = process.platform === 'win32' ? 'npx.cmd' : 'npx';
            const STARTUP_TIMEOUT_MS = 10_000;
            const child = spawn(npx, ['-y', 'chrome-devtools-mcp@1.7.0', '--browser-url=http://127.0.0.1:9222', '--no-performance-crux', '--no-usage-statistics'], { stdio: ['pipe', 'pipe', 'ignore'] });
            let startupComplete = false;
            let timedOut = false;
            let forceKill;
            let startupTimer;
            let startupInput = '';
            let startupOutput = '';
            const startupRequestIds = new Set();
            const finish = (code) => { clearTimeout(startupTimer); clearTimeout(forceKill); process.stdin.unpipe(child.stdin); process.exit(timedOut ? 1 : (code ?? 1)); };
            startupTimer = setTimeout(() => { timedOut = true; process.stderr.write('chrome-devtools-mcp startup timed out after 10s\\n'); child.kill('SIGTERM'); forceKill = setTimeout(() => { child.kill('SIGKILL'); finish(1); }, 1_000); }, STARTUP_TIMEOUT_MS);
            process.stdin.on('data', (chunk) => { startupInput += String(chunk); let newline; while ((newline = startupInput.indexOf("\n")) >= 0) { const line = startupInput.slice(0, newline); startupInput = startupInput.slice(newline + 1); try { const message = JSON.parse(line); if (message.method === 'tools/list' && message.id !== undefined) startupRequestIds.add(String(message.id)); } catch {} } });
            child.stdout.on('data', (chunk) => { startupOutput += String(chunk); let newline; while ((newline = startupOutput.indexOf("\n")) >= 0) { const line = startupOutput.slice(0, newline); startupOutput = startupOutput.slice(newline + 1); try { const message = JSON.parse(line); if (message.id !== undefined && startupRequestIds.delete(String(message.id)) && !startupComplete) { startupComplete = true; clearTimeout(startupTimer); } } catch {} } });
            process.stdin.pipe(child.stdin);
            child.stdout.pipe(process.stdout);
            child.once('error', (error) => { process.stderr.write(String(error)); finish(1); });
            child.once('exit', finish);

    - id: tui-runner
      name: 'dsh-omc-tui'
