# A terminal app layer over the shared dsh-base services. It deliberately does
# not mount the Web host or server runtime.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Agent-facing tools and prompt sections are supplied by the selected preset.
# Keeping the base copies disabled prevents a minimal preset from inheriting
# the full standard catalog through the host layer.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-goal
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: agent-instructions
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-web
  disabled: true

- insert:
    # Shipped rc.1 presets opt into the Host-owned subagent model-selection policy.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    # PTC mode is a core execution capability, also used by the headless bundle.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Model-facing question tool; the TUI runner registers the UI provider.
    - id: user-questions-tool
      name: '@deepseek-ai/dsh-tool-ask-user'

    # The TUI starts a dedicated Chrome instance only when these tools run.
    - id: mcp-chrome-devtools
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: chrome_devtools
        transport: stdio
        # chrome-devtools-mcp writes its legal and roots notices directly to
        # stderr. Keep protocol stdout/stdin intact, but do not inherit stderr
        # into the interactive TUI footer.
        command: node
        args:
          - -e
          - >-
            const { spawn } = require('node:child_process');
            const npx = process.platform === 'win32' ? 'npx.cmd' : 'npx';
            const child = spawn(npx, ['-y', 'chrome-devtools-mcp@1.7.0', '--browser-url=http://127.0.0.1:9222', '--no-performance-crux', '--no-usage-statistics'], { stdio: ['inherit', 'inherit', 'ignore'] });
            child.once('error', (error) => { process.stderr.write(String(error)); process.exit(1); });
            child.once('exit', (code) => process.exit(code ?? 1));

    - id: tui-runner
      name: 'dsh-omc-tui'
